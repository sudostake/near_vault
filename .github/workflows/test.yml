name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  HOST_TOOLCHAIN: 1.89.0
  CONTRACT_TOOLCHAIN: 1.86.0
  CARGO_NEAR_VERSION: 0.19.1

jobs:
  code-formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install host Rust toolchain
        run: |
          rustup toolchain install "${HOST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${HOST_TOOLCHAIN}"
      - name: Check formatting
        run: cargo fmt --all -- --check

  code-linter:
    name: Code Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust toolchains
        run: |
          rustup toolchain install "${HOST_TOOLCHAIN}" --profile minimal
          rustup default "${HOST_TOOLCHAIN}"
          rustup toolchain install "${CONTRACT_TOOLCHAIN}" --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Run contract lint script
        run: bash scripts/lint_contract.sh

  contract-build:
    name: Contract Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust toolchains
        run: |
          rustup toolchain install "${HOST_TOOLCHAIN}" --profile minimal
          rustup default "${HOST_TOOLCHAIN}"
          rustup toolchain install "${CONTRACT_TOOLCHAIN}" --profile minimal --target wasm32-unknown-unknown
      - name: Install system dependencies for cargo-near
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libusb-1.0-0-dev
      - name: Install cargo-near CLI
        run: cargo install cargo-near --version "${CARGO_NEAR_VERSION}" --locked
      - name: Build contract with pinned toolchain
        run: bash scripts/build_contract.sh
      - name: Build contract reproducibly
        run: bash scripts/build_contract.sh reproducible-wasm

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install host Rust toolchain
        run: |
          rustup toolchain install "${HOST_TOOLCHAIN}" --profile minimal
          rustup default "${HOST_TOOLCHAIN}"
      - name: Run tests
        run: cargo test --locked
